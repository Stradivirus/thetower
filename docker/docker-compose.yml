# 파일명: thetower/docker/docker-compose.yml
# 용도: 전체 서비스(백엔드, 프론트엔드) 컨테이너 오케스트레이션 설정
# 특징: 서비스 간 의존성 관리 및 볼륨 영구화 설정 포함

services:
  # 1. FastAPI 백엔드 서비스 (기존 PostgreSQL)
  backend:
    build:
      context: ../
      dockerfile: docker/backend.Dockerfile
    container_name: thetower_backend
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_SERVER: ${POSTGRES_SERVER}
      POSTGRES_SERVER_READ: ${POSTGRES_SERVER_READ}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PORT: 5432
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL}
      SLACK_INQUIRY_URL: ${SLACK_INQUIRY_URL}
      OWNER_USERNAME: ${OWNER_USERNAME:-test}

  # 2. FastAPI 백엔드 서비스 (신규 MySQL HeatWave 병행 테스트/전환용)
  backend_mysql:
    build:
      context: ../
      dockerfile: docker/backend_mysql.Dockerfile
    container_name: thetower_backend_mysql
    restart: always
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_SERVER: ${POSTGRES_SERVER}
      POSTGRES_SERVER_READ: ${POSTGRES_SERVER_READ}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PORT: 5432
      MYSQL_USER: ${MYSQL_USER:-}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-}
      MYSQL_HOST: ${MYSQL_HOST:-}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_DB: ${MYSQL_DB:-thetower}
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL}
      SLACK_INQUIRY_URL: ${SLACK_INQUIRY_URL}
      OWNER_USERNAME: ${OWNER_USERNAME:-test}

  # 3. React + Caddy 프론트엔드 서비스
  frontend:
    build:
      context: ../
      dockerfile: docker/frontend.Dockerfile
    container_name: thetower_frontend
    restart: always
    depends_on:
      - backend
      - backend_mysql
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3 지원을 위한 UDP 포트 개방
    volumes:
      # 설정 파일 및 데이터 영구 저장 처리
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data/caddy
      - caddy_config:/config/caddy

# 데이터 영구 저장을 위한 도커 볼륨 정의
volumes:
  caddy_data:   # SSL 인증서 및 상태 정보 보관
  caddy_config: # Caddy 자동 저장 설정 보관